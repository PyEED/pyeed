services:
  neo4j:
    image: neo4j:2025.10.1-community-bullseye
    container_name: neo4j
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 38g
          cpus: "4.0"

    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"

    environment:
      # authentication
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}

      # memory
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL_SIZE}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE}

      # plugins
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_PLUGINS: '["apoc","apoc-extended","graph-data-science"]'

    volumes:
      - ${NEO4J_DATA_DIR}:/data
      - ${NEO4J_LOGS_DIR}:/logs
      - ${NEO4J_IMPORT_DIR}:/import
      - ${NEO4J_PLUGIN_DIR}:/plugins

    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

    networks:
      - backend

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

    environment:
      ETCD_AUTO_COMPACTION_MODE: ${ETCD_AUTO_COMPACTION_MODE}
      ETCD_AUTO_COMPACTION_RETENTION: ${ETCD_AUTO_COMPACTION_RETENTION}
      ETCD_QUOTA_BACKEND_BYTES: ${ETCD_QUOTA_BACKEND_BYTES}
      ETCD_SNAPSHOT_COUNT: ${ETCD_SNAPSHOT_COUNT}
    command: >
      etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - ${ETCD_DATA_DIR}:/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: milvus-minio
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "2.0"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: [ "server", "/minio_data", "--console-address", ":9001" ]
    ports:
      - "${MINIO_API_PORT}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT}:9001" # MinIO console
    volumes:
      - ${MINIO_DATA_DIR}:/minio_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - backend

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.4
    restart: unless-stopped
    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined

    deploy:
      resources:
        limits:
          memory: 72g
          cpus: "16.0"
    mem_swappiness: 0
    shm_size: 4g

    environment:
      ETCD_ENDPOINTS: ${ETCD_ENDPOINTS}
      MINIO_ADDRESS: ${MINIO_ADDRESS}
      MQ_TYPE: ${MQ_TYPE}
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MILVUS_GRPC_PORT}:19530"
      - "${MILVUS_REST_PORT}:9091"

    volumes:
      - ${MILVUS_DATA_DIR}:/var/lib/milvus

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

    depends_on:
      - etcd
      - minio
    networks:
      - backend

  attu:
    container_name: attu
    image: zilliz/attu:v2.6.1

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

    environment:
      MILVUS_URL: ${MILVUS_URL}
    ports:
      - "8000:3000"
    depends_on:
      - "milvus"
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pyeed-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Override with Docker service names for internal networking
      NEO4J_URI: "neo4j://neo4j:7687"
      MILVUS_URI: "http://milvus:19530"
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy

    ports:
      - "${REST_PORT}:8080"
    networks:
      - backend

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: pyeed-mcp
    restart: unless-stopped
    env_file: .env
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "${MCP_PORT}:8081"
    networks:
      - backend

networks:
  backend:
    driver: bridge
