[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeed"
version = "1.0.0"
description = "Toolkit to create, annotate, and analyze sequence data"
authors = [
  { name = "Max Häußler", email = "max.haeussler@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "esm>=3.2.1.post1",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "neo4j>=5.28.2",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "tenacity>=9.1.2",
    "torch>=2.8.0",
    "transformers>=4.48.1",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
check_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "pyeed/analysis",
  "pyeed/embeddings",
]

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","SIM","PL","RUF"]
ignore = ["E203"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]

[dependency-groups]
dev = [
    "ruff>=0.12.12",
    "ruff-lsp>=0.0.62",
]
